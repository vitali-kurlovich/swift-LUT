syntax = "proto3";

enum PCubeLUTKind {
    ONE_DIMENSIONAL = 0;
    THREE_DIMENSIONAL = 1;
}

message PMeta {
  optional string title = 1;
  optional string description = 2;
}

message PVector3D {
    float x = 1;
    float y = 2;
    float z = 3;
}

message PCubeLUT {
  PMeta meta = 1;
  PCubeLUTKind kind = 2;
  uint32 dimension = 3;
  PVector3D domain_min = 4;
  PVector3D domain_max = 5;
  repeated float data = 6;
}
